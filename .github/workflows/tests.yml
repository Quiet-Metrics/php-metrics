name: Tests
on:
  push: { branches: [main] }
  pull_request:
jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix: { php: ['7.4', '8.4'] }
    name: "PHP ${{ matrix.php }}"
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit
